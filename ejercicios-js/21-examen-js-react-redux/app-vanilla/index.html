<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de tareas - Examen JS → React → Redux</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Lista de tareas</h1>

    <form id="form-add" class="mb-3">
      <div class="input-group">
        <input type="text" id="input-text" class="form-control" placeholder="Nueva tarea" required />
        <button type="submit" class="btn btn-primary">Añadir</button>
      </div>
    </form>

    <div id="filter-buttons" class="btn-group mb-3" role="group">
      <button type="button" class="btn btn-outline-secondary active" data-filter="all">Todas</button>
      <button type="button" class="btn btn-outline-secondary" data-filter="active">Activas</button>
      <button type="button" class="btn btn-outline-secondary" data-filter="completed">Completadas</button>
    </div>

    <div id="loading" class="text-center py-3"></div>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <ul id="task-list" class="list-group list-group-flush"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
